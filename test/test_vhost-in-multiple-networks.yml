version: '2'

networks:
  net1: {}
  net2: {}
  net3: {}

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:test
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - net1

  web:
    image: web
    expose:
      - "80"
      - "81"
      - "82"
    environment:
      WEB_PORTS: 80 81 82
      VIRTUAL_HOST: web1.nginx-proxy.local
      VIRTUAL_PORT: 81
    networks:
      - net1
      - net2
      - net3
