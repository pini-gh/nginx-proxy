version: "2"

services:
  web:
    image: web
    expose:
      - "81"
    environment:
      WEB_PORTS: 81
      VIRTUAL_HOST: web.nginx-proxy.tld

  sut:
    image: nginxproxy/nginx-proxy:test
    environment:
      HTTPS_METHOD: nohttps
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
